name: Feature request
description: 提出新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 你遇到了什么问题，或者希望改进哪个流程？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述你希望脚本怎么处理。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 如果你想过其他做法，可以写在这里。
